<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>צרי קשר | רחלי כהן</title>
  <meta name="description" content="צרי קשר עם רחלי כהן, יצרנית פאות - טלפון, מייל, אינסטגרם וטופס יצירת קשר.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="modals.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body data-page="contact">
  <div class="promo-bar">עולם של תוכן – לגלות, ללמוד ולשמור</div>

  <div class="body-row">
    <aside class="side-col">
      <div id="site-logo" class="logo"></div>
      <nav id="icon-rail" class="icon-rail" aria-label="ניווט ראשי"></nav>
    </aside>

    <div class="content">
      <main>
        <section class="topics-row" style="padding-top:26px">
          <div class="topic" data-topic="tipuach" role="button" tabindex="0" aria-label="צפייה בסטורי טיפוח"><div class="topic-ring"><div class="topic-ring-in"><img src="assets/home_topic_tipuach.jpg" alt="טיפוח" loading="lazy"></div></div><span>טיפוח</span></div>
          <div class="topic" data-topic="mivne" role="button" tabindex="0" aria-label="צפייה בסטורי מבנה"><div class="topic-ring"><div class="topic-ring-in"><img src="assets/home_topic_mivne.jpg" alt="מבנה" loading="lazy"></div></div><span>מבנה</span></div>
          <div class="topic" data-topic="tzeva" role="button" tabindex="0" aria-label="צפייה בסטורי צבע"><div class="topic-ring"><div class="topic-ring-in"><img src="assets/home_topic_tzeva.jpg" alt="צבע" loading="lazy"></div></div><span>צבע</span></div>
          <div class="topic" data-topic="leaz" role="button" tabindex="0" aria-label="צפייה בסטורי לייס"><div class="topic-ring"><div class="topic-ring-in"><img src="assets/home_topic_leaz.jpg" alt="לייס" loading="lazy"></div></div><span>לייס</span></div>
          <div class="topic" data-topic="topim" role="button" tabindex="0" aria-label="צפייה בסטורי טופים"><div class="topic-ring"><div class="topic-ring-in"><img src="assets/home_topic_topim.jpg" alt="טופים" loading="lazy"></div></div><span>טופים</span></div>
          <div class="topic" data-topic="tnua" role="button" tabindex="0" aria-label="צפייה בסטורי תנועה"><div class="topic-ring"><div class="topic-ring-in"><img src="assets/home_topic_tnua.jpg" alt="תנועה" loading="lazy"></div></div><span>תנועה</span></div>
          <div class="topic" data-topic="misgeret" role="button" tabindex="0" aria-label="צפייה בסטורי מסגרת"><div class="topic-ring"><div class="topic-ring-in"><img src="assets/home_topic_misgeret.jpg" alt="מסגרת" loading="lazy"></div></div><span>מסגרת</span></div>
          <div class="topic" data-topic="orech" role="button" tabindex="0" aria-label="צפייה בסטורי אורך"><div class="topic-ring"><div class="topic-ring-in"><img src="assets/home_topic_orech.jpg" alt="אורך" loading="lazy"></div></div><span>אורך</span></div>
          <div class="topic" data-topic="tivaiyot" role="button" tabindex="0" aria-label="צפייה בסטורי טבעיות"><div class="topic-ring"><div class="topic-ring-in"><img src="assets/home_topic_tivaiyot.jpg" alt="טבעיות" loading="lazy"></div></div><span>טבעיות</span></div>
        </section>

        <section class="contact-hero">
          <div class="contact-blob"></div>
          <h1>צרי קשר</h1>
        </section>

        <section class="contact-wrap">
          <div class="contact-form-card">
            <h2>נשמח לשמוע ממך</h2>
            <form id="contact-form">
              <div class="field-row">
                <div class="field"><input type="text" placeholder="שם:" required></div>
                <div class="field"><input type="tel" placeholder="טלפון:" required></div>
              </div>
              <div class="field-row">
                <div class="field"><input type="email" placeholder="מייל:"></div>
              </div>
              <div class="field-row">
                <div class="field"><textarea placeholder="מה תרצי לספר לי?"></textarea></div>
              </div>
              <button type="submit" class="btn-primary">שליחת הודעה</button>
            </form>
          </div>

          <div class="contact-info">
            <div class="info-card">
              <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h4l2 5-2.5 1.5a11 11 0 0 0 5 5L14 14l5 2v4c0 1.1-.9 2-2 2C9.6 22 2 14.4 2 7c0-1.1.9-2 2-2Z"/></svg></div>
              <div><h3>טלפון</h3><a href="tel:+972500000000" dir="ltr">050-000-0000</a></div>
            </div>
            <div class="info-card">
              <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg></div>
              <div><h3>מייל</h3><a href="mailto:info@rachelicohen.co.il">info@rachelicohen.co.il</a></div>
            </div>
            <div class="info-card">
              <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
              <div><h3>סטודיו</h3><p>לפי תיאום מראש בלבד</p></div>
            </div>

            <div class="info-card" style="flex-direction:column;align-items:flex-start;gap:12px;">
              <h3>עקבי אחריי</h3>
              <div class="social-row">
                <a href="#" aria-label="אינסטגרם"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg></a>
                <a href="#" aria-label="וואטסאפ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20l1.4-4A8 8 0 1 1 9 19l-5 1Z"/></svg></a>
                <a href="#" aria-label="פייסבוק"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 8h2V5h-2a4 4 0 0 0-4 4v2H9v3h2v6h3v-6h2.2l.8-3H14V9a1 1 0 0 1 1-1Z"/></svg></a>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer id="site-footer" class="site-footer"></footer>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('תודה! ההודעה נשלחה ורחלי תחזור אלייך בקרוב.');
      this.reset();
    });
  </script>
</body>
</html>
