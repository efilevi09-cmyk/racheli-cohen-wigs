              <p class="story-caption">נושא?</p>

              <img src="assets/journey_side.jpg" alt="">

            <div class="story-card">
              <img src="assets/journey_side.jpg" alt="">
              <p class="story-caption">אותה השראה. שתי פאות שונות.</p>
            </div>

            <button class="story-nav next" aria-label="הבא">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
